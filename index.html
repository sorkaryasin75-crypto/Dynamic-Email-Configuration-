<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Mini App - Multi-Account Inbox Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config for Dark Mode and Colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gmail: {
                            red: '#ea4335',
                            blue: '#4285f4',
                            green: '#34a853',
                            yellow: '#fbbc05',
                            darkBg: '#18191a',
                            darkCard: '#242526',
                            darkBorder: '#3a3b3c'
                        }
                    }
                }
            }
        };
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Custom scrollbar for clean UI inside Telegram WebApp */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #a0aec0;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #4a5568;
        }
        /* Mobile viewport fixes for Telegram WebApp wrapper */
        body {
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gmail-darkBg text-gray-800 dark:text-gray-200 transition-colors duration-200 h-screen flex flex-col overflow-hidden font-sans">

    <!-- ========================================== -->
    <!-- TOP NAVIGATION / HEADER BAR                -->
    <!-- ========================================== -->
    <header class="bg-white dark:bg-gmail-darkCard border-b border-gray-200 dark:border-gmail-darkBorder px-4 py-3 flex items-center justify-between shadow-sm z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <!-- Sidebar / Accounts Toggle -->
            <button id="toggle-sidebar-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-envelope text-gmail-red text-2xl"></i>
                <span class="font-bold text-lg hidden sm:inline text-gray-800 dark:text-white">Gmail Manager</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-xl mx-4">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Search emails..." class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border border-transparent focus:border-gmail-blue text-sm rounded-xl focus:outline-none dark:text-white transition-all">
            </div>
        </div>

        <!-- Header Controls (Theme, Sync, Profile) -->
        <div class="flex items-center space-x-2">
            <!-- Sync / Refresh -->
            <button id="refresh-btn" title="Refresh Inbox" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 focus:outline-none">
                <i class="fa-solid fa-rotate-right" id="refresh-icon"></i>
            </button>
            <!-- Dark Mode Toggle -->
            <button id="theme-toggle" title="Toggle Theme" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 focus:outline-none">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <!-- Active Account Avatar -->
            <button id="active-account-btn" title="Manage Accounts" class="relative focus:outline-none">
                <img id="active-avatar" src="https://placehold.co/100x100/ea4335/ffffff?text=G" alt="Profile" class="w-8 h-8 rounded-full border-2 border-gmail-blue object-cover">
                <span id="account-count-badge" class="absolute -top-1 -right-1 bg-gmail-red text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
            </button>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN APP WRAPPER (SIDEBAR + CONTENT)       -->
    <!-- ========================================== -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="absolute md:relative z-30 w-64 h-full bg-white dark:bg-gmail-darkCard border-r border-gray-200 dark:border-gmail-darkBorder flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            <!-- Compose Button -->
            <div class="p-4">
                <button id="open-compose-btn" class="w-full flex items-center justify-center space-x-3 bg-gmail-blue hover:bg-blue-600 text-white py-3 px-4 rounded-2xl shadow-md transition-all font-medium">
                    <i class="fa-solid fa-pen"></i>
                    <span>Compose</span>
                </button>
            </div>

            <!-- Folders List -->
            <nav class="flex-1 px-2 space-y-1 overflow-y-auto">
                <button data-label="INBOX" class="nav-folder-btn active-nav w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition-colors">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-inbox text-gmail-blue w-5"></i>
                        <span>Inbox</span>
                    </div>
                    <span id="badge-inbox" class="text-xs bg-blue-100 dark:bg-blue-900/40 text-gmail-blue px-2 py-0.5 rounded-full font-bold">0</span>
                </button>

                <button data-label="STARRED" class="nav-folder-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-star text-gmail-yellow w-5"></i>
                        <span>Starred</span>
                    </div>
                </button>

                <button data-label="SENT" class="nav-folder-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-paper-plane text-gmail-green w-5"></i>
                        <span>Sent</span>
                    </div>
                </button>

                <button data-label="TRASH" class="nav-folder-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-trash-can text-gray-500 w-5"></i>
                        <span>Trash</span>
                    </div>
                </button>
            </nav>

            <!-- Multi-Account Section in Sidebar Footer -->
            <div class="p-3 border-t border-gray-200 dark:border-gmail-darkBorder bg-gray-50 dark:bg-gray-800/50">
                <div class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 px-1">ACCOUNTS MANAGEMENT</div>
                <div id="accounts-list" class="space-y-1 max-h-36 overflow-y-auto">
                    <!-- Account Item Templates inserted here dynamically -->
                </div>
                <button id="add-account-btn" class="w-full mt-2 flex items-center justify-center space-x-2 py-2 px-3 border border-dashed border-gray-300 dark:border-gray-600 rounded-xl text-xs font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Connect Google Account</span>
                </button>
            </div>
        </aside>

        <!-- OVERLAY FOR MOBILE SIDEBAR -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- MAIN CONTENT AREA (SPLIT VIEW ON DESKTOP / SINGLE VIEW ON MOBILE) -->
        <main class="flex-1 flex overflow-hidden relative">

            <!-- EMAIL LIST COLUMN -->
            <section id="email-list-container" class="w-full md:w-5/12 lg:w-4/12 border-r border-gray-200 dark:border-gmail-darkBorder flex flex-col h-full bg-white dark:bg-gmail-darkCard z-10 transition-all">
                <!-- Status Bar -->
                <div class="px-4 py-2 border-b border-gray-100 dark:border-gmail-darkBorder flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 bg-gray-50/50 dark:bg-gray-800/30">
                    <span id="current-folder-title" class="font-bold uppercase tracking-wider">INBOX</span>
                    <span id="sync-status">Updated just now</span>
                </div>

                <!-- Email Message Cards Container -->
                <div id="email-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gmail-darkBorder">
                    <!-- Loading Skeleton -->
                    <div id="email-skeleton" class="p-4 space-y-4">
                        <div class="animate-pulse flex space-x-3">
                            <div class="rounded-full bg-gray-300 dark:bg-gray-700 h-10 w-10"></div>
                            <div class="flex-1 space-y-2 py-1">
                                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-3/4"></div>
                                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-5/6"></div>
                            </div>
                        </div>
                        <div class="animate-pulse flex space-x-3">
                            <div class="rounded-full bg-gray-300 dark:bg-gray-700 h-10 w-10"></div>
                            <div class="flex-1 space-y-2 py-1">
                                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-1/2"></div>
                                <div class="h-3 bg-gray-200 dark:bg-gray-800 rounded w-4/5"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden flex-col items-center justify-center p-8 text-center h-full">
                        <i class="fa-solid fa-inbox text-5xl text-gray-300 dark:text-gray-600 mb-3"></i>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">No emails found in this folder.</p>
                    </div>
                </div>
            </section>

            <!-- EMAIL READER / PREVIEW PANE -->
            <section id="email-reader" class="hidden md:flex flex-1 flex-col h-full bg-white dark:bg-gmail-darkCard absolute md:relative inset-0 z-20 transition-all">
                
                <!-- Placeholder when no email selected -->
                <div id="no-email-selected" class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400">
                    <i class="fa-regular fa-envelope-open text-6xl mb-4 text-gray-300 dark:text-gray-600"></i>
                    <p class="text-base font-medium">Select an email to view its details</p>
                </div>

                <!-- Active Email View Container -->
                <div id="email-view-content" class="hidden flex-col h-full">
                    <!-- Reader Action Header -->
                    <div class="p-3 border-b border-gray-200 dark:border-gmail-darkBorder flex items-center justify-between bg-gray-50/50 dark:bg-gray-800/30">
                        <div class="flex items-center space-x-2">
                            <!-- Back Button for Mobile View -->
                            <button id="close-reader-btn" class="md:hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                            <button id="delete-email-btn" title="Delete Email" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                            <button id="mark-unread-btn" title="Mark as Unread" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                                <i class="fa-solid fa-envelope"></i>
                            </button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span id="email-time-detail" class="text-xs text-gray-500 dark:text-gray-400"></span>
                        </div>
                    </div>

                    <!-- Email Detailed Body -->
                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                        <h1 id="email-subject-detail" class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white leading-tight"></h1>
                        
                        <!-- Sender Profile -->
                        <div class="flex items-start justify-between border-b border-gray-100 dark:border-gmail-darkBorder pb-4">
                            <div class="flex items-center space-x-3">
                                <div id="sender-avatar" class="w-10 h-10 rounded-full bg-gmail-blue text-white font-bold flex items-center justify-center text-lg">
                                    A
                                </div>
                                <div>
                                    <div id="sender-name" class="text-sm font-semibold text-gray-900 dark:text-white"></div>
                                    <div id="sender-email" class="text-xs text-gray-500 dark:text-gray-400"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Main HTML Body Render Frame -->
                        <div id="email-body-container" class="mt-4 text-sm text-gray-800 dark:text-gray-200 leading-relaxed overflow-x-auto">
                            <!-- Email Body injected here dynamically -->
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- ========================================== -->
    <!-- COMPOSE EMAIL MODAL                        -->
    <!-- ========================================== -->
    <div id="compose-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gmail-darkCard w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
            <!-- Modal Header -->
            <div class="bg-gray-100 dark:bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-200 dark:border-gmail-darkBorder">
                <h3 class="font-bold text-sm text-gray-700 dark:text-gray-200">New Message</h3>
                <button id="close-compose-btn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Modal Form -->
            <form id="compose-form" class="p-4 flex flex-col flex-1 space-y-3 overflow-y-auto">
                <input type="email" id="compose-to" placeholder="To" required class="w-full px-3 py-2 border-b border-gray-200 dark:border-gmail-darkBorder bg-transparent text-sm focus:outline-none dark:text-white">
                <input type="text" id="compose-subject" placeholder="Subject" required class="w-full px-3 py-2 border-b border-gray-200 dark:border-gmail-darkBorder bg-transparent text-sm focus:outline-none dark:text-white">
                <textarea id="compose-message" placeholder="Write your email here..." rows="8" required class="w-full px-3 py-2 bg-transparent text-sm focus:outline-none resize-none dark:text-white flex-1"></textarea>
                
                <!-- Attachment Simulation -->
                <div class="flex items-center space-x-2 pt-2 border-t border-gray-100 dark:border-gmail-darkBorder">
                    <label class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full text-gray-500">
                        <i class="fa-solid fa-paperclip"></i>
                        <input type="file" id="compose-file" class="hidden" multiple onchange="handleFileAttach(event)">
                    </label>
                    <span id="file-count" class="text-xs text-gray-400">No attachments</span>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center justify-end space-x-3 pt-3">
                    <button type="button" id="cancel-compose-btn" class="px-4 py-2 text-xs font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl">Discard</button>
                    <button type="submit" id="send-email-btn" class="px-6 py-2 bg-gmail-blue hover:bg-blue-600 text-white text-xs font-medium rounded-xl shadow-md flex items-center space-x-2">
                        <span>Send</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 z-50 transform translate-y-20 opacity-0 transition-all duration-300">
        <i id="toast-icon" class="fa-solid fa-circle-info text-gmail-blue"></i>
        <span id="toast-message" class="text-xs font-medium">Notification message</span>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC & GOOGLE ASYNC ENGINE     -->
    <!-- ========================================== -->
    <script>
        /**
         * CONFIGURATION INSTRUCTIONS:
         * Replace YOUR_GOOGLE_CLIENT_ID with your valid OAuth Client ID from Google Cloud Console.
         * Authorized JavaScript Origins: Your GitHub Pages Domain (e.g. https://username.github.io)
         */
        const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";
        const GMAIL_SCOPES = "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify";

        // Application State Management
        let accounts = []; // Array of { email, token, profilePic, name, expiresAt }
        let currentAccountIndex = 0;
        let activeFolder = 'INBOX';
        let emailsData = [];
        let tokenClient = null;
        let tgApp = null;

        // Initialize Application on Window Load
        window.onload = async function() {
            initTelegramSDK();
            initTheme();
            initGoogleGIS();
            loadAccountsFromStorage();
            setupEventListeners();
            
            // Auto Refresh every 60 seconds
            setInterval(() => {
                if(accounts.length > 0) fetchEmails(false);
            }, 60000);
        };

        /* ---------------------------------------------------- */
        /* 1. TELEGRAM MINI APP INTEGRATION                     */
        /* ---------------------------------------------------- */
        function initTelegramSDK() {
            if (window.Telegram && window.Telegram.WebApp) {
                tgApp = window.Telegram.WebApp;
                tgApp.ready();
                tgApp.expand(); // Expand Mini App to full height inside Telegram
                
                // Sync Theme with Telegram default theme if present
                if (tgApp.colorScheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    updateThemeIcon(true);
                }
            }
        }

        /* ---------------------------------------------------- */
        /* 2. PERSISTENT STORAGE (Telegram CloudStorage / Local)*/
        /* ---------------------------------------------------- */
        function saveAccountsToStorage() {
            const dataToSave = JSON.stringify(accounts);
            if (tgApp && tgApp.CloudStorage) {
                tgApp.CloudStorage.setItem('gmail_accounts', dataToSave);
            }
            localStorage.setItem('gmail_accounts', dataToSave);
        }

        function loadAccountsFromStorage() {
            if (tgApp && tgApp.CloudStorage) {
                tgApp.CloudStorage.getItem('gmail_accounts', (err, value) => {
                    if (!err && value) {
                        accounts = JSON.parse(value);
                        renderAccountsUI();
                    } else {
                        loadFromLocalStorage();
                    }
                });
            } else {
                loadFromLocalStorage();
            }
        }

        function loadFromLocalStorage() {
            const stored = localStorage.getItem('gmail_accounts');
            if (stored) {
                accounts = JSON.parse(stored);
                renderAccountsUI();
            }
        }

        /* ---------------------------------------------------- */
        /* 3. GOOGLE OAUTH2 (GIS - Google Identity Services)   */
        /* ---------------------------------------------------- */
        function initGoogleGIS() {
            if (window.google && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: GMAIL_SCOPES,
                    callback: async (tokenResponse) => {
                        if (tokenResponse.error) {
                            showToast("Authentication Failed: " + tokenResponse.error, "error");
                            return;
                        }
                        await handleNewTokenSuccess(tokenResponse.access_token, tokenResponse.expires_in);
                    },
                });
            } else {
                setTimeout(initGoogleGIS, 500); // Retry if SDK not ready
            }
        }

        function authenticateNewAccount() {
            if (!tokenClient) {
                showToast("Google Auth Client not loaded yet. Check Client ID.", "error");
                return;
            }
            // Prompt account selection
            tokenClient.requestAccessToken({ prompt: 'select_account' });
        }

        async function handleNewTokenSuccess(accessToken, expiresIn) {
            showToast("Authenticated successfully. Fetching profile...", "info");
            try {
                // Fetch user profile info via Google API
                const profileRes = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const profileData = await profileRes.json();

                const newAccount = {
                    email: profileData.email,
                    name: profileData.name || profileData.email.split('@')[0],
                    picture: profileData.picture || `https://placehold.co/100x100/ea4335/ffffff?text=${profileData.email[0].toUpperCase()}`,
                    token: accessToken,
                    expiresAt: Date.now() + (expiresIn * 1000)
                };

                // Check if account already exists, update token or add new
                const existingIdx = accounts.findIndex(a => a.email === newAccount.email);
                if (existingIdx >= 0) {
                    accounts[existingIdx] = newAccount;
                    currentAccountIndex = existingIdx;
                } else {
                    accounts.push(newAccount);
                    currentAccountIndex = accounts.length - 1;
                }

                saveAccountsToStorage();
                renderAccountsUI();
                fetchEmails();
                showToast(`Logged in as ${newAccount.email}`, "success");
            } catch (err) {
                showToast("Failed to fetch user profile", "error");
            }
        }

        /* ---------------------------------------------------- */
        /* 4. REAL DYNAMIC GMAIL REST API ASYNC FETCHING        */
        /* ---------------------------------------------------- */
        async function fetchEmails(showSkeleton = true) {
            if (accounts.length === 0) {
                renderEmptyState("No account connected. Please login first.");
                return;
            }

            const currentAcc = accounts[currentAccountIndex];
            if (!currentAcc || !currentAcc.token) {
                renderEmptyState("Session expired. Please reconnect account.");
                return;
            }

            if (showSkeleton) {
                document.getElementById('email-skeleton').classList.remove('hidden');
                document.getElementById('email-list').querySelectorAll('.email-card').forEach(e => e.remove());
                document.getElementById('empty-state').classList.add('hidden');
            }

            document.getElementById('sync-status').innerText = "Syncing...";
            document.getElementById('refresh-icon').classList.add('fa-spin');

            try {
                // Step 1: Get list of message IDs for the active folder/label
                const listUrl = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=label:${activeFolder}&maxResults=15`;
                const listRes = await fetch(listUrl, {
                    headers: { Authorization: `Bearer ${currentAcc.token}` }
                });

                if (listRes.status === 401) {
                    showToast("Token expired. Re-authenticating...", "error");
                    tokenClient.requestAccessToken({ prompt: '' }); // Silent re-auth request
                    return;
                }

                const listData = await listRes.json();
                
                if (!listData.messages || listData.messages.length === 0) {
                    emailsData = [];
                    renderEmailList();
                    return;
                }

                // Step 2: Asynchronously fetch details for each message
                const emailPromises = listData.messages.map(msg => fetchEmailDetails(msg.id, currentAcc.token));
                emailsData = await Promise.all(emailPromises);

                renderEmailList();
                document.getElementById('sync-status').innerText = "Updated " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch (err) {
                showToast("Error loading emails: " + err.message, "error");
            } finally {
                document.getElementById('email-skeleton').classList.add('hidden');
                document.getElementById('refresh-icon').classList.remove('fa-spin');
            }
        }

        async function fetchEmailDetails(messageId, token) {
            const detailUrl = `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}?format=full`;
            const res = await fetch(detailUrl, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            return parseGmailMessage(data);
        }

        // Helper to parse complex Gmail API Payload
        function parseGmailMessage(message) {
            const headers = message.payload.headers;
            const subject = headers.find(h => h.name.toLowerCase() === 'subject')?.value || '(No Subject)';
            const from = headers.find(h => h.name.toLowerCase() === 'from')?.value || 'Unknown';
            const date = headers.find(h => h.name.toLowerCase() === 'date')?.value || '';
            const snippet = message.snippet || '';

            let body = '';
            if (message.payload.body && message.payload.body.data) {
                body = decodeBase64(message.payload.body.data);
            } else if (message.payload.parts) {
                const htmlPart = message.payload.parts.find(p => p.mimeType === 'text/html');
                const textPart = message.payload.parts.find(p => p.mimeType === 'text/plain');
                if (htmlPart && htmlPart.body.data) {
                    body = decodeBase64(htmlPart.body.data);
                } else if (textPart && textPart.body.data) {
                    body = decodeBase64(textPart.body.data);
                }
            }

            return {
                id: message.id,
                snippet,
                subject,
                from,
                date: date ? new Date(date).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '',
                body: body || snippet,
                isUnread: message.labelIds ? message.labelIds.includes('UNREAD') : false
            };
        }

        function decodeBase64(encodedStr) {
            try {
                let base64 = encodedStr.replace(/-/g, '+').replace(/_/g, '/');
                return decodeURIComponent(escape(window.atob(base64)));
            } catch (e) {
                return "Unable to decode email contents.";
            }
        }

        /* ---------------------------------------------------- */
        /* 5. UI RENDERING & COMPONENT MANAGERS                 */
        /* ---------------------------------------------------- */
        function renderAccountsUI() {
            const listContainer = document.getElementById('accounts-list');
            listContainer.innerHTML = '';

            document.getElementById('account-count-badge').innerText = accounts.length;

            if (accounts.length === 0) {
                document.getElementById('active-avatar').src = "https://placehold.co/100x100/ea4335/ffffff?text=G";
                return;
            }

            const activeAcc = accounts[currentAccountIndex];
            if (activeAcc) {
                document.getElementById('active-avatar').src = activeAcc.picture;
            }

            accounts.forEach((acc, idx) => {
                const isSelected = idx === currentAccountIndex;
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2 rounded-xl cursor-pointer transition ${isSelected ? 'bg-blue-50 dark:bg-blue-900/30 border border-gmail-blue' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}`;
                item.onclick = () => switchAccount(idx);

                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <img src="${acc.picture}" class="w-6 h-6 rounded-full object-cover">
                        <div class="truncate">
                            <p class="text-xs font-semibold text-gray-800 dark:text-gray-200 truncate">${acc.name}</p>
                            <p class="text-[10px] text-gray-500 dark:text-gray-400 truncate">${acc.email}</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); removeAccount(${idx})" class="text-gray-400 hover:text-gmail-red p-1">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        function switchAccount(index) {
            currentAccountIndex = index;
            renderAccountsUI();
            fetchEmails();
            showToast("Switched account to " + accounts[index].email, "info");
        }

        function removeAccount(index) {
            accounts.splice(index, 1);
            if (currentAccountIndex >= accounts.length) currentAccountIndex = Math.max(0, accounts.length - 1);
            saveAccountsToStorage();
            renderAccountsUI();
            fetchEmails();
            showToast("Account removed", "info");
        }

        function renderEmailList() {
            const container = document.getElementById('email-list');
            // Remove previous elements except skeleton and empty state
            container.querySelectorAll('.email-item').forEach(el => el.remove());

            if (emailsData.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('flex');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('flex');

            emailsData.forEach(email => {
                const card = document.createElement('div');
                card.className = `email-item p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/60 transition flex items-start space-x-3 border-b border-gray-100 dark:border-gmail-darkBorder ${email.isUnread ? 'bg-blue-50/30 dark:bg-blue-900/10 font-semibold' : ''}`;
                
                const initial = email.from.charAt(0).toUpperCase() || 'E';
                
                card.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-blue-100 dark:bg-blue-900 text-gmail-blue dark:text-blue-200 font-bold flex items-center justify-center shrink-0 text-sm">
                        ${initial}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <p class="text-xs text-gray-900 dark:text-white truncate ${email.isUnread ? 'font-bold' : 'font-medium'}">${escapeHtml(email.from)}</p>
                            <span class="text-[10px] text-gray-400 shrink-0">${email.date}</span>
                        </div>
                        <h4 class="text-xs text-gray-800 dark:text-gray-200 truncate mb-1">${escapeHtml(email.subject)}</h4>
                        <p class="text-[11px] text-gray-500 dark:text-gray-400 truncate leading-snug">${escapeHtml(email.snippet)}</p>
                    </div>
                `;

                card.onclick = () => openEmailReader(email);
                container.appendChild(card);
            });

            // Update badge unread count
            const unreadCount = emailsData.filter(e => e.isUnread).length;
            document.getElementById('badge-inbox').innerText = unreadCount;
        }

        function openEmailReader(email) {
            document.getElementById('no-email-selected').classList.add('hidden');
            document.getElementById('email-view-content').classList.remove('hidden');
            document.getElementById('email-view-content').classList.add('flex');

            document.getElementById('email-subject-detail').innerText = email.subject;
            document.getElementById('sender-name').innerText = email.from;
            document.getElementById('sender-email').innerText = email.from;
            document.getElementById('sender-avatar').innerText = email.from.charAt(0).toUpperCase();
            document.getElementById('email-time-detail').innerText = email.date;
            document.getElementById('email-body-container').innerHTML = email.body;

            // Display view on mobile
            const readerContainer = document.getElementById('email-reader');
            readerContainer.classList.remove('hidden');
            readerContainer.classList.add('flex');
        }

        /* ---------------------------------------------------- */
        /* 6. SEND EMAIL (COMPOSE ENGINE)                       */
        /* ---------------------------------------------------- */
        async function sendEmail(e) {
            e.preventDefault();
            if (accounts.length === 0) {
                showToast("Please login first to send email", "error");
                return;
            }

            const currentAcc = accounts[currentAccountIndex];
            const to = document.getElementById('compose-to').value;
            const subject = document.getElementById('compose-subject').value;
            const message = document.getElementById('compose-message').value;

            const sendBtn = document.getElementById('send-email-btn');
            sendBtn.disabled = true;
            sendBtn.innerText = "Sending...";

            // Create RFC 2822 Email Format
            const rawEmail = [
                `To: ${to}`,
                `Subject: ${subject}`,
                'Content-Type: text/html; charset=utf-8',
                'MIME-Version: 1.0',
                '',
                message
            ].join('\r\n');

            // Base64Url Encode
            const encodedEmail = btoa(unescape(encodeURIComponent(rawEmail)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            try {
                const response = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentAcc.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ raw: encodedEmail })
                });

                if (response.ok) {
                    showToast("Email sent successfully!", "success");
                    toggleComposeModal(false);
                    document.getElementById('compose-form').reset();
                } else {
                    const err = await response.json();
                    showToast("Failed to send: " + err.error.message, "error");
                }
            } catch (err) {
                showToast("Error sending email: " + err.message, "error");
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<span>Send</span><i class="fa-solid fa-paper-plane"></i>`;
            }
        }

        /* ---------------------------------------------------- */
        /* 7. EVENT LISTENERS & INTERACTION HELPERS             */
        /* ---------------------------------------------------- */
        function setupEventListeners() {
            // Dark Mode Toggle
            document.getElementById('theme-toggle').onclick = () => {
                const isDark = document.documentElement.classList.toggle('dark');
                updateThemeIcon(isDark);
            };

            // Sidebar Mobile Toggle
            document.getElementById('toggle-sidebar-btn').onclick = toggleSidebar;
            document.getElementById('sidebar-overlay').onclick = toggleSidebar;

            // Nav Folders Switching
            document.querySelectorAll('.nav-folder-btn').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.nav-folder-btn').forEach(b => {
                        b.classList.remove('active-nav', 'bg-blue-50', 'dark:bg-blue-900/30', 'text-gmail-blue');
                    });
                    const target = e.currentTarget;
                    target.classList.add('active-nav', 'bg-blue-50', 'dark:bg-blue-900/30', 'text-gmail-blue');
                    
                    activeFolder = target.getAttribute('data-label');
                    document.getElementById('current-folder-title').innerText = activeFolder;
                    fetchEmails();

                    // Hide Mobile Sidebar after selection
                    if (window.innerWidth < 768) toggleSidebar();
                };
            });

            // Account Addition Button
            document.getElementById('add-account-btn').onclick = authenticateNewAccount;
            document.getElementById('active-account-btn').onclick = toggleSidebar;

            // Refresh Button
            document.getElementById('refresh-btn').onclick = () => fetchEmails(true);

            // Compose Modal Triggers
            document.getElementById('open-compose-btn').onclick = () => toggleComposeModal(true);
            document.getElementById('close-compose-btn').onclick = () => toggleComposeModal(false);
            document.getElementById('cancel-compose-btn').onclick = () => toggleComposeModal(false);
            document.getElementById('compose-form').onsubmit = sendEmail;

            // Mobile Back button in Reader
            document.getElementById('close-reader-btn').onclick = () => {
                const reader = document.getElementById('email-reader');
                reader.classList.add('hidden');
                reader.classList.remove('flex');
            };

            // Search Filter Listener
            document.getElementById('search-input').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.email-item');
                items.forEach(item => {
                    const text = item.innerText.toLowerCase();
                    item.style.display = text.includes(term) ? 'flex' : 'none';
                });
            };
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isHidden = sidebar.classList.contains('-translate-x-full');

            if (isHidden) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleComposeModal(show) {
            const modal = document.getElementById('compose-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function handleFileAttach(e) {
            const files = e.target.files;
            document.getElementById('file-count').innerText = files.length > 0 ? `${files.length} file(s) attached` : 'No attachments';
        }

        function initTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            icon.className = isDark ? "fa-solid fa-sun text-yellow-400" : "fa-solid fa-moon";
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.innerText = message;
            if (type === "error") {
                iconEl.className = "fa-solid fa-circle-exclamation text-gmail-red";
            } else if (type === "success") {
                iconEl.className = "fa-solid fa-circle-check text-gmail-green";
            } else {
                iconEl.className = "fa-solid fa-circle-info text-gmail-blue";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function renderEmptyState(msg) {
            document.getElementById('email-list').querySelectorAll('.email-item').forEach(e => e.remove());
            document.getElementById('email-skeleton').classList.add('hidden');
            const emptyState = document.getElementById('empty-state');
            emptyState.querySelector('p').innerText = msg;
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
